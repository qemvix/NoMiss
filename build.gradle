plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven { url = 'https://maven.terraformersmc.com/releases/' }
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"nomiss" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Compile the shared code against the selected development target. Ship both library sets:
// a tiny, Minecraft-specific dependency marker makes Fabric select a matching set at runtime.
def compatibilityTargets = [
    '26.2': [fabricApi: '0.161.0+26.2', modMenu: '20.0.3'],
    '26.3': [fabricApi: '0.164.0+26.3', modMenu: '21.0.0']
]
def developmentTarget = compatibilityTargets[project.minecraft_version]
if (developmentTarget == null) {
    throw new GradleException("Supported development targets are 26.2 and 26.3")
}
def bundledModules = ['fabric-api-base', 'fabric-key-mapping-api-v1', 'fabric-lifecycle-events-v1', 'fabric-resource-loader-v1']

compatibilityTargets.each { minecraftVersion, target ->
    def suffix = minecraftVersion.replace('.', '_')
    def bundle = configurations.create("bundledFabric${suffix}") {
        canBeConsumed = false
        transitive = false
    }
    def requirements = [minecraft: minecraftVersion, nomiss: ">=${project.version}"]
    bundledModules.each { module ->
        def dependency = fabricApi.module(module, target.fabricApi)
        dependencies.add(bundle.name, dependency)
        requirements[module] = "=" + dependency.toString().split(':', 3)[2]
    }
    // Separate configurations keep Gradle from collapsing the two module versions into one.
    tasks.named('jar', Jar) {
        from(bundle) {
            into "META-INF/jars/${minecraftVersion}"
            rename { filename -> bundledModules.find { filename.startsWith(it + '-') } + '.jar' }
        }
    }

    def metadata = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
        schemaVersion: 1,
        id: 'nomiss-platform',
        version: minecraftVersion,
        name: "NoMiss compatibility for Minecraft ${minecraftVersion}",
        environment: 'client',
        license: 'All-Rights-Reserved',
        depends: requirements,
        custom: [modmenu: [parent: 'nomiss', badges: ['library']]]
    ]))
    def metadataFile = layout.buildDirectory.file("generated/platform-${minecraftVersion}/fabric.mod.json")
    def generateMetadata = tasks.register("generatePlatform${suffix}") {
        inputs.property('metadata', metadata)
        outputs.file(metadataFile)
        doLast {
            def output = metadataFile.get().asFile
            output.parentFile.mkdirs()
            output.setText(metadata, 'UTF-8')
        }
    }
    def platformJar = tasks.register("platformJar${suffix}", Jar) {
        dependsOn(generateMetadata)
        archiveFileName = "nomiss-platform-${minecraftVersion}.jar"
        destinationDirectory = layout.buildDirectory.dir('platforms')
        from(metadataFile)
    }
    tasks.named('jar', Jar) {
        from(platformJar.flatMap { it.archiveFile }) { into 'META-INF/jars' }
    }
    if (minecraftVersion == project.minecraft_version) {
        dependencies.add('runtimeOnly', files(platformJar))
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    bundledModules.each { module ->
        implementation fabricApi.module(module, developmentTarget.fabricApi)
    }
    compileOnly "com.terraformersmc:modmenu:${developmentTarget.modMenu}"
    if (project.hasProperty('withModMenu')) {
        runtimeOnly "com.terraformersmc:modmenu:${developmentTarget.modMenu}"
    }
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
    def universalJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    dependsOn(tasks.named('jar'))
    inputs.file(universalJar)
    systemProperty 'nomiss.testJar', universalJar.get().asFile.absolutePath
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
